[project]
name = "fmcg-qna-agent"
version = "0.1.0"
description = "AB InBev Q&A agent prototype -- multi-agent enterprise Q&A over real, publicly disclosed financial results"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# The core runtime (src/) has ZERO required third-party dependencies -- see
# requirements.txt and docs/DESIGN_DECISIONS.md for why. Everything below is
# an optional extra: install only the group(s) you actually need.
[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
websearch = ["duckduckgo-search>=6.0", "requests>=2.31.0"]
notebook = ["jupyter>=1.0.0", "notebook>=7.0.0"]
dotenv = ["python-dotenv>=1.2.3"]
ui = ["streamlit>=1.38.0"]

# `uv run`/`uv sync` install this group by default (unlike the optional-
# dependencies above, which are opt-in for an actual install) -- convenience
# for anyone actively developing or running this repo locally, since that
# workflow wants everything at once regardless of which LLM provider they pick.
[dependency-groups]
dev = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "duckduckgo-search>=6.0",
    "requests>=2.31.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.38.0",
]
